<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novara Writer Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/writer/writer-monetization-ai.css" />
  <link rel="stylesheet" href="/css/writer/writer-dashboard.css" />
</head>
<body>
  <div class="layout writer-dashboard-layout">
    <aside class="sidebar writer-dashboard-sidebar" aria-label="Writer Navigation">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon" aria-hidden="true">N</div>
        <span class="sidebar-logo-text">Novara</span>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-label">Writer Studio</div>
        <nav id="writerSidebarNav" class="wd-sidebar-nav">
          <button type="button" class="nav-item sidebar-link active is-active" data-section="home">
            <span class="nav-icon wd-ic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
            Home
          </button>
          <button type="button" class="nav-item sidebar-link" data-section="stories">
            <span class="nav-icon wd-ic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
            My Books
          </button>
          <button type="button" class="nav-item sidebar-link" data-section="ai-tools">
            <span class="nav-icon wd-ic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/></svg></span>
            AI Assistant
          </button>
        </nav>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-label">Monetization</div>
        <a class="nav-item sidebar-link" id="aiEarningsNavLink" href="/writer/writer-monetization-ai.html">
          <span class="nav-icon wd-ic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
          Earnings
        </a>
        <a class="nav-item" href="/writer/writer-referrals.html">
          <span class="nav-icon wd-ic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg></span>
          Referrals
        </a>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-label">Account</div>
        <a class="nav-item" href="/reader/settings.html">
          <span class="nav-icon wd-ic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.39 0 .74.18.99.46l.06.06"/></svg></span>
          Settings
        </a>
        <a class="nav-item" href="#">
          <span class="nav-icon wd-ic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
          Notifications
        </a>
      </div>

      <div class="sidebar-bottom">
        <div class="writer-card">
          <div class="writer-avatar" id="authorAvatar">NR</div>
          <div class="writer-name" id="writerPenName">Writer</div>
          <div class="writer-role">Author</div>
          <div id="writerGenres" class="writer-genre-chips"></div>
          <p id="writerBio" class="writer-bio-truncate"></p>
          <div class="writer-tier">Gold Writer</div>
        </div>
      </div>
    </aside>

    <div class="main writer-dashboard-main">
      <header class="top-bar writer-dashboard-topbar">
        <div class="top-bar-tabs wd-top-tabs">
          <div id="dashboardSwitcher" class="dashboard-switcher-slot" aria-live="polite"></div>
        </div>
        <div class="top-bar-right">
          <a class="btn btn-outline" href="/reader/profile.html">Profile</a>
          <a class="btn btn-outline" href="#" id="profileSignOutLink">Sign Out</a>
        </div>
      </header>

      <div id="accessNotice" class="wd-access-notice" hidden></div>

      <div class="page-header writer-dashboard-page-header">
        <div class="section-eyebrow">Writer Studio</div>
        <h1 class="page-title" id="writerHeading">Writer Dashboard</h1>
        <p class="page-subtitle" id="writerSubtitle">Manage books, track growth, and publish from one workspace.</p>
        <div class="wd-quick-actions" id="heroActions">
          <button type="button" class="wd-qa-btn" data-action="create-story">
            <span class="wd-qa-ic" aria-hidden="true">+</span>
            New Book
          </button>
          <button type="button" class="wd-qa-btn" data-action="new-chapter">
            <span class="wd-qa-ic wd-qa-ic-doc" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
            Publish Chapter
          </button>
          <button type="button" class="wd-qa-btn" data-action="view-analytics">
            <span class="wd-qa-ic wd-qa-ic-doc" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
            View Analytics
          </button>
        </div>
      </div>

      <div class="writer-main-inner">
        <div id="writerHomeDashboard" class="wd-home-dashboard">
          <div id="writerStats" class="stats-grid wd-stats-grid"></div>

          <div class="row row-2 wd-dash-row">
            <div class="card wd-dash-card">
              <div class="wd-card-head">
                <h3 class="wd-card-title">Weekly reads</h3>
              </div>
              <div id="readsChart" class="reads-chart wd-reads-chart"></div>
            </div>
            <div class="card wd-dash-card">
              <div class="wd-card-head">
                <h3 class="wd-card-title">Top books</h3>
              </div>
              <div id="wdTopBooks" class="wd-top-books"></div>
            </div>
          </div>

          <div class="row row-2 wd-dash-row">
            <div class="card wd-dash-card">
              <div class="wd-card-head">
                <h3 class="wd-card-title">Writing progress</h3>
              </div>
              <div id="writingTools" class="wd-writing-progress"></div>
            </div>
            <div class="card wd-dash-card">
              <div class="wd-card-head">
                <h3 class="wd-card-title">Recent activity</h3>
              </div>
              <div id="recentActivity" class="wd-activity-list"></div>
            </div>
          </div>
        </div>

        <div id="writerSectionContent" class="writer-hub-content wd-spa-section" hidden aria-live="polite"></div>
      </div>

      <div id="monetizationStats" class="wd-sr-only" aria-hidden="true"></div>
      <div id="analyticsStats" class="wd-sr-only" aria-hidden="true"></div>
      <div id="assistantActions" class="wd-sr-only" aria-hidden="true"></div>
      <div id="writerContent" class="wd-sr-only" aria-hidden="true"></div>
    </div>
  </div>

  <script src="/js/shared/novara-session.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="/js/writer/writer-dashboard.js"></script>
  <script>
    if (window.location.pathname.endsWith("writer-monetization-ai.html")) {
      document.querySelectorAll(".sidebar-link").forEach(function (el) {
        el.classList.remove("active", "is-active");
      });
      var aiLink = document.getElementById("aiEarningsNavLink");
      if (aiLink) {
        aiLink.classList.add("active", "is-active");
      }
    }
  </script>
</body>
</html>
