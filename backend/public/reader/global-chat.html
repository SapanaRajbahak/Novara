<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novara — Global Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared/style.css" />
  <link rel="stylesheet" href="/css/reader/chat.css" />
</head>
<body data-chat-type="global">
  <div class="hub-shell">
    <aside class="hub-sidebar" aria-label="Primary">
      <a class="hub-brand" href="/reader/reader-dashboard.html">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Novara</span>
      </a>
      <nav class="hub-nav">
        <a href="/reader/reader-dashboard.html">Home</a>
        <a href="/reader/library.html">Library</a>
        <a href="/reader/discover.html">Discover</a>
        <a href="/reader/audiobook.html">Audiobooks</a>
        <a href="/reader/reader-monetization.html" id="walletNavLink">Wallet</a>
        <span class="hub-nav-label">Community</span>
        <a href="/reader/global-chat.html" class="active">🌍 Global Chat</a>
        <a href="/reader/book-chat.html" target="_blank">📖 Book Chat</a>
        <span class="hub-nav-label">Messages</span>
        <a href="/reader/messages.html">💌 Private DMs</a>
        <a href="/writer/writer-dashboard.html" id="writerNavLink" hidden>Writer Dashboard</a>
      </nav>
      <section class="writer-journey-panel" id="writerJourneyPanel" hidden aria-live="polite"></section>
    </aside>

    <div class="hub-main">
      <header class="hub-topbar">
        <div class="hub-topbar-left">
          <h1>Global Chat</h1>
          <p>Chat with everyone on Novara</p>
        </div>
        <div class="hub-topbar-right">
          <div id="dashboardSwitcher" class="dashboard-switcher-slot" aria-live="polite"></div>
          <div class="profile-menu">
            <button class="profile-menu__trigger" id="profileMenuBtn" aria-haspopup="true" aria-expanded="false">
              <span class="avatar" id="dashboardAvatar">NR</span>
              <span class="profile-name" id="dashboardProfileName">Reader</span>
            </button>
            <div class="profile-menu__dropdown" id="profileMenuDropdown" hidden>
              <button id="signOutBtn">Sign out</button>
            </div>
          </div>
        </div>
      </header>

      <main class="hub-content">
        <div class="chat-shell">
          <div class="chat-header">
            <h2 id="chatHeader">🌍 Global Chat</h2>
            <p id="chatSubheader">Everyone on Novara</p>
          </div>

          <div id="messages">
            <p class="chat-empty">No messages yet. Say hello! 👋</p>
          </div>

          <div class="chat-input-row">
            <input id="chatInput" type="text" placeholder="Type a message…" autocomplete="off" />
            <button id="chatSend">Send</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/shared/novara-session.js?v=20260322a"></script>
  <script src="/js/shared/app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/reader/chat.js"></script>
</body>
</html>
