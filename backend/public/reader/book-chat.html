<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novara — Book Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared/style.css" />
  <link rel="stylesheet" href="/css/reader/chat.css" />
  <link rel="stylesheet" href="/css/reader/book-chat.css" />
</head>
<body data-chat-type="book">

  <div class="bc-layout">

    <!-- ── LEFT SIDEBAR ── -->
    <aside class="bc-sidebar">
      <div class="bc-sidebar-top">
        <div class="bc-sidebar-header">
          <span class="bc-sidebar-title">📖 Book Chat</span>
          <a href="/reader/reader-dashboard.html" class="bc-back-link" title="Back to dashboard">←</a>
        </div>
        <div class="bc-sidebar-search">
          <input id="bcSearch" type="search" placeholder="Search books…" autocomplete="off" />
        </div>
      </div>

      <div class="bc-rooms-scroll">
        <p class="bc-section-label" id="savedLabel" hidden>SAVED ROOMS</p>
        <ul id="savedRoomsList" class="bc-room-list" aria-label="Saved rooms"></ul>

        <p class="bc-section-label">ALL ROOMS</p>
        <ul id="allRoomsList" class="bc-room-list" aria-label="All rooms">
          <li class="bc-room-loading">Loading rooms…</li>
        </ul>
      </div>

      <div class="bc-sidebar-footer">
        <div class="bc-foot-avatar" id="bcFootAvatar">NR</div>
        <div class="bc-foot-info">
          <span class="bc-foot-name" id="bcFootName">Reader</span>
          <span class="bc-foot-status"><span class="bc-online-dot"></span>online</span>
        </div>
      </div>
    </aside>

    <!-- ── MAIN CHAT AREA ── -->
    <div class="bc-main">

      <!-- Welcome state (no book selected) -->
      <div class="bc-welcome" id="bcWelcome">
        <div class="bc-welcome-inner">
          <span class="bc-welcome-icon">📖</span>
          <h2>Pick a book to chat about</h2>
          <p>Choose from the list on the left to join a discussion room.</p>
        </div>
      </div>

      <!-- Chat area (shown when a book is selected) -->
      <div class="bc-chat" id="bcChat" hidden>

        <div class="bc-chat-header">
          <img class="bc-book-cover" id="bcBookCover" src="" alt="" />
          <div class="bc-book-meta">
            <span class="bc-book-title" id="bcBookTitle">—</span>
            <span class="bc-book-author" id="bcBookAuthor">—</span>
          </div>
          <span class="bc-online-badge" id="bcOnlineBadge" hidden>
            <span class="bc-online-dot"></span><span id="bcOnlineCount">0</span>&nbsp;online
          </span>
          <button class="bc-save-btn" id="bcSaveBtn" title="Save this room" aria-pressed="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
            <span>Save</span>
          </button>
        </div>

        <div id="messages" class="bc-messages">
          <p class="chat-empty">No messages yet. Start the discussion! 📖</p>
        </div>

        <div class="bc-input-row">
          <!-- hidden stubs kept for chat.js compatibility -->
          <h2 id="chatHeader" hidden></h2>
          <p  id="chatSubheader" hidden></p>
          <input id="chatInput" type="text" placeholder="Type a message…" autocomplete="off" />
          <button id="chatSend" title="Send">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="/js/shared/novara-session.js?v=20260322a"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/reader/chat.js"></script>
</body>
</html>
