<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novara — Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared/style.css" />
  <link rel="stylesheet" href="/css/reader/chat.css" />
  <link rel="stylesheet" href="/css/reader/messages.css" />
</head>
<body data-chat-type="dm">

  <div class="dm-layout">

    <!-- ── LEFT SIDEBAR ─────────────────────────────────────────── -->
    <aside class="dm-sidebar">

      <div class="dm-sidebar-top">
        <div class="dm-heading-row">
          <a href="/reader/reader-dashboard.html" class="dm-back-link" title="Dashboard">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </a>
          <h1 class="dm-heading">Messages</h1>
        </div>

        <div class="dm-search-wrap">
          <svg class="dm-search-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input id="dmSearch" type="search" placeholder="Search messages or people" autocomplete="off" />
        </div>

        <div class="dm-tabs">
          <button class="dm-tab dm-tab--active" id="dmTabMessages">Messages</button>
          <button class="dm-tab" id="dmTabRequests">Requests <span class="dm-tab-badge" id="dmRequestsBadge" hidden>0</span></button>
        </div>

        <button class="dm-new-btn" id="dmNewBtn">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          New message
        </button>
      </div>

      <!-- Conversation list -->
      <div class="dm-conv-list" id="dmConvList">
        <div class="dm-conv-empty" id="dmConvEmpty">No conversations yet.</div>
      </div>

      <!-- Sidebar footer: current user info -->
      <div class="dm-sidebar-footer">
        <div class="dm-foot-av" id="dmFootAv"></div>
        <div class="dm-foot-info">
          <span class="dm-foot-name" id="dmFootName">Reader</span>
          <span class="dm-foot-online"><span class="dm-dot"></span>online</span>
        </div>
        <a href="/reader/reader-dashboard.html" class="dm-foot-home" title="Go to dashboard">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </a>
      </div>
    </aside>

    <!-- ── RIGHT MAIN ────────────────────────────────────────────── -->
    <div class="dm-main">

      <!-- Welcome splash (shown when no conversation is active) -->
      <div class="dm-welcome" id="dmWelcome">
        <div class="dm-welcome-inner">
          <div class="dm-welcome-icon">💌</div>
          <h2>Your Messages</h2>
          <p>Send private notes to readers you meet in Global or Book Chat.</p>
          <button class="dm-welcome-start" id="dmWelcomeStart">New message</button>
        </div>
      </div>

      <!-- Active conversation panel -->
      <div class="dm-chat" id="dmChat" hidden>

        <!-- Conversation header -->
        <div class="dm-chat-header">
          <div class="dm-chat-header-info">
            <div class="dm-chat-av" id="dmChatAv"></div>
            <div class="dm-chat-meta">
              <span class="dm-chat-name" id="dmChatName">—</span>
              <span class="dm-chat-status" id="dmChatStatus">Last seen recently</span>
            </div>
          </div>
          <div class="dm-chat-actions">
            <button class="dm-action-btn dm-action-btn--danger" id="dmDeleteConv" title="Delete conversation">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
                <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
              </svg>
            </button>
            <button class="dm-action-btn" id="dmCloseChat" title="Close conversation">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Messages container — id="messages" is required by chat.js -->
        <div id="messages" class="dm-messages"></div>

        <!-- Input row — chatInput / chatSend required by chat.js -->
        <div class="dm-input-row">
          <!-- Hidden stubs used internally by chat.js openChat() -->
          <h2 id="chatHeader" hidden></h2>
          <p  id="chatSubheader" hidden></p>
          <input id="chatInput" type="text" placeholder="Type a message…" autocomplete="off" />
          <button id="chatSend" title="Send">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>

    </div><!-- /.dm-main -->
  </div><!-- /.dm-layout -->

  <!-- ── NEW MESSAGE MODAL ─────────────────────────────────────── -->
  <div class="dm-modal-overlay" id="dmNewModal" hidden>
    <div class="dm-modal-box" role="dialog" aria-modal="true" aria-label="New message">
      <div class="dm-modal-header">
        <span>New message</span>
        <button class="dm-modal-close" id="dmNewModalClose" aria-label="Close">×</button>
      </div>
      <input id="dmUserSearch" type="text" placeholder="Search by name or nickname…"
             autocomplete="off" spellcheck="false" />
      <ul id="dmUserResults" class="dm-user-results" role="listbox"></ul>
    </div>
  </div>

  <script src="/js/shared/novara-session.js?v=20260322a"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/reader/chat.js"></script>
</body>
</html>
