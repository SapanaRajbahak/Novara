<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novara Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin/admin.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" aria-label="Admin Navigation">
      <a href="/admin/admin.html" class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Novara Admin</span>
      </a>

      <nav class="sidebar-nav">
        <a href="#" class="active">Dashboard</a>
        <a href="/admin/admin-books.html">Books</a>
        <a href="/admin/admin-upload.html">Upload Book</a>
        <a href="/admin/admin-chapters.html">Chapters</a>
        <a href="/admin/admin-audiobooks.html">Audiobooks</a>
        <a href="/admin/admin-ai.html">AI Generator</a>
        <a href="/admin/admin-users.html">Users</a>
        <a href="/admin/admin-analytics.html">Analytics</a>

        <div class="sidebar-group-label">MONETIZATION</div>
        <button type="button" id="openControlsPanelBtn" class="sidebar-monetization-link" style="width:100%;text-align:left;">
          <span class="sidebar-monetization-icon">🛠️</span>Controls
        </button>
        <button type="button" id="openPayoutPanelBtn" class="sidebar-monetization-link" style="width:100%;text-align:left;">
          <span class="sidebar-monetization-icon">💸</span>Payout
        </button>
        <button type="button" id="openRevenuePanelBtn" class="sidebar-monetization-link" style="width:100%;text-align:left;">
          <span class="sidebar-monetization-icon">📈</span>Revenue
        </button>
        <button type="button" id="openSubscriptionPanelBtn" class="sidebar-monetization-link" style="width:100%;text-align:left;">
          <span class="sidebar-monetization-icon">🔔</span>Subscription
        </button>

        <a href="/admin/admin-settings.html">Settings</a>
      </nav>

      <button type="button" id="logoutBtn" class="logout-btn">Logout</button>
    </aside>

    <main class="admin-main">
      <header class="main-topbar">
        <div style="display: flex; align-items: center; gap: 2rem;">
          <div>
            <p class="eyebrow">Admin Panel</p>
            <h1>Dashboard Overview</h1>
          </div>
          <div id="dashboardSwitcher" style="margin-left: 2rem;"></div>
        </div>
        <div class="quick-actions" id="quickActions"></div>
      </header>

      <section class="widgets" id="widgets"></section>


      <section class="panel" aria-labelledby="uploadsHeading">
        <div class="panel-head">
          <h2 id="uploadsHeading">Recent Uploads</h2>
          <button type="button" class="text-btn">Export</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Type</th>
                <th>Author</th>
                <th>Status</th>
                <th>Uploaded At</th>
              </tr>
            </thead>
            <tbody id="uploadsTableBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel" aria-labelledby="aiHeading">
        <div class="panel-head">
          <h2 id="aiHeading">Recently Generated AI Content</h2>
          <button type="button" class="text-btn">Open AI Generator</button>
        </div>
        <div class="ai-grid" id="aiGrid"></div>
      </section>
    </main>
  </div>

  <script src="/js/shared/novara-session.js"></script>
  <script src="/js/admin/admin-dashboard-switcher.js"></script>
  <script src="/js/admin/admin.js"></script>
</body>
</html>
