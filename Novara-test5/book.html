<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovelRead Book Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="book.css" />
</head>
<body>
  <header class="book-topbar">
    <a href="library.html" class="brand-link">
      <span class="brand-dot" aria-hidden="true"></span>
      <span>NovelRead</span>
    </a>
    <nav class="top-links" aria-label="Back links">
      <a href="library.html">Library</a>
      <a href="index.html">Home</a>
    </nav>
  </header>

  <main class="book-page" id="bookPage" aria-live="polite">
    <section class="book-left" aria-label="Book actions">
      <img id="coverImage" class="cover-large" src="" alt="Book cover" />
      <div class="primary-actions">
        <button id="readBtn" type="button" class="btn btn-primary">Read</button>
        <button id="resumeBtn" type="button" class="btn btn-secondary hidden">Resume Reading</button>
        <button id="listenBtn" type="button" class="btn btn-secondary">Listen</button>
      </div>
      <p id="resumeHint" class="rating hidden"></p>
      <div class="secondary-actions">
        <button id="saveBtn" type="button" class="btn btn-ghost">Save to Library</button>
        <button id="favoriteBtn" type="button" class="btn btn-ghost">Bookmark/Favorite</button>
        <button id="shareBtn" type="button" class="btn btn-ghost">Share</button>
      </div>
    </section>

    <section class="book-right" aria-label="Book details">
      <p class="eyebrow">Book Details</p>
      <h1 id="bookTitle">Loading title...</h1>
      <p id="bookAuthor" class="author">Loading author...</p>

      <div id="genreTags" class="tags"></div>

      <p id="ratingPlaceholder" class="rating">Rating: --.-- / 5.0</p>

      <p id="bookDescription" class="description"></p>

      <div class="metadata" aria-label="Book metadata">
        <article class="meta-card">
          <h2>Language</h2>
          <p id="metaLanguage">-</p>
        </article>
        <article class="meta-card">
          <h2>Chapters</h2>
          <p id="metaChapters">-</p>
        </article>
        <article class="meta-card">
          <h2>Format</h2>
          <p id="metaFormat">-</p>
        </article>
        <article class="meta-card">
          <h2>Audiobook</h2>
          <p id="metaAudio">-</p>
        </article>
      </div>

      <div class="tabs" role="tablist" aria-label="Book tabs">
        <button type="button" class="tab-btn active" data-tab="about" role="tab" aria-selected="true">About</button>
        <button type="button" class="tab-btn" data-tab="chapters" role="tab" aria-selected="false">Chapters</button>
        <button type="button" class="tab-btn" data-tab="reviews" role="tab" aria-selected="false">Reviews</button>
        <button type="button" class="tab-btn" data-tab="related" role="tab" aria-selected="false">Related Books</button>
      </div>

      <section class="tab-panel active" id="tab-about" data-panel="about" role="tabpanel">
        <h3>About this book</h3>
        <p id="aboutText"></p>
      </section>

      <section class="tab-panel" id="tab-chapters" data-panel="chapters" role="tabpanel">
        <h3>Chapters</h3>
        <ul id="chapterList" class="chapter-list"></ul>

        <div id="audioTracksWrap" class="audio-tracks hidden">
          <h3>Audiobook Tracks</h3>
          <ul id="trackList" class="chapter-list"></ul>
        </div>
      </section>

      <section class="tab-panel" id="tab-reviews" data-panel="reviews" role="tabpanel">
        <h3>Reviews</h3>
        <div id="reviewsList" class="reviews-list"></div>
      </section>

      <section class="tab-panel" id="tab-related" data-panel="related" role="tabpanel">
        <h3>Related Books</h3>
        <div id="relatedList" class="related-grid"></div>
      </section>
    </section>
  </main>

  <script src="book.js"></script>
</body>
</html>
