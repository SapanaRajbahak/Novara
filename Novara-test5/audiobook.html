<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novara Audiobook Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="audiobook.css" />
</head>
<body>
  <div class="player-shell" id="playerShell">
    <header class="player-topbar">
      <a id="backLink" href="book.html" class="btn ghost">Back</a>
      <p class="top-title">Audiobook Player</p>
      <button id="drawerToggleBtn" class="btn ghost" type="button">Tracks</button>
    </header>

    <main class="player-main">
      <aside id="trackDrawer" class="track-drawer" aria-label="Track list">
        <h2>Chapters & Tracks</h2>
        <ul id="trackList" class="track-list"></ul>
      </aside>

      <section class="player-center" aria-label="Player">
        <img id="coverImage" class="cover" src="" alt="Audiobook cover" />

        <div class="meta">
          <h1 id="bookTitle">Loading...</h1>
          <p id="bookAuthor" class="muted">Author</p>
          <p id="currentTrack" class="muted">Track</p>
        </div>

        <div class="waveform" aria-label="Waveform placeholder">
          <div class="bars" id="waveBars"></div>
        </div>

        <div class="progress-wrap">
          <input id="progressSlider" type="range" min="0" max="100" step="1" value="0" />
          <div class="time-row">
            <span id="currentTime">00:00</span>
            <span id="durationTime">00:00</span>
          </div>
        </div>

        <div class="controls">
          <button id="skipBackBtn" class="circle" type="button">-10s</button>
          <button id="playPauseBtn" class="circle play" type="button">Play</button>
          <button id="skipForwardBtn" class="circle" type="button">+10s</button>
        </div>

        <div class="extra-controls">
          <label>
            Speed
            <select id="speedSelect">
              <option value="0.75">0.75x</option>
              <option value="1" selected>1x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="1.75">1.75x</option>
              <option value="2">2x</option>
            </select>
          </label>

          <label>
            Sleep timer
            <select id="sleepTimerSelect">
              <option value="0" selected>Off</option>
              <option value="10">10 min</option>
              <option value="20">20 min</option>
              <option value="30">30 min</option>
              <option value="45">45 min</option>
              <option value="60">60 min</option>
            </select>
          </label>

          <button id="bookmarkBtn" class="btn" type="button">Bookmark Timestamp</button>
        </div>

        <p id="syncStatus" class="muted" aria-live="polite">Last synced: not yet</p>

        <section class="bookmarks">
          <h2>Bookmarks</h2>
          <ul id="bookmarkList" class="bookmark-list"></ul>
        </section>
      </section>
    </main>

    <footer class="mini-player" id="miniPlayer">
      <div class="mini-meta">
        <strong id="miniTitle">No track</strong>
        <small id="miniTime">00:00 / 00:00</small>
      </div>
      <div class="mini-controls">
        <button id="miniPrevBtn" type="button">Prev</button>
        <button id="miniPlayBtn" type="button">Play</button>
        <button id="miniNextBtn" type="button">Next</button>
      </div>
    </footer>

    <audio id="audioPlayer" preload="metadata"></audio>
  </div>

  <script src="audiobook.js"></script>
</body>
</html>
