<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
</head>
<body>
  <p>Redirecting to Admin Dashboard...</p>
  <script>
    (function redirectToBackend() {
      const target = `${window.location.protocol}//${window.location.host}/admin/dashboard${window.location.search || ""}${window.location.hash || ""}`;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
