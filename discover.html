<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovelRead Discover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="discover.css" />
</head>
<body>
  <header class="discover-topbar">
    <a class="brand" href="index.html">
      <span class="brand-dot" aria-hidden="true"></span>
      <span>NovelRead</span>
    </a>
    <nav class="top-nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="library.html">Library</a>
      <a href="discover.html" class="active">Discover</a>
    </nav>
  </header>

  <main class="discover-main">
    <section class="search-hero" aria-label="Search">
      <h1>Discover your next favorite story</h1>
      <label class="search-box" for="searchInput">
        <input id="searchInput" type="search" placeholder="Search title, author, genre, tags..." />
      </label>

      <div class="chip-row" id="categoryChips" aria-label="Categories"></div>

      <div class="quick-panels">
        <article class="panel">
          <h2>Trending Searches</h2>
          <div class="chip-row" id="trendingSearches"></div>
        </article>
        <article class="panel">
          <h2>Recommended Genres</h2>
          <div class="chip-row" id="recommendedGenres"></div>
        </article>
      </div>
    </section>

    <section class="content-layout">
      <aside class="filters" id="filtersSidebar" aria-label="Advanced filters">
        <div class="filters-head">
          <h2>Filters</h2>
          <button type="button" id="resetFiltersBtn" class="text-btn">Reset</button>
        </div>

        <label class="field" for="filterGenre">
          <span>Genre</span>
          <select id="filterGenre"></select>
        </label>

        <label class="field" for="filterLanguage">
          <span>Language</span>
          <select id="filterLanguage"></select>
        </label>

        <label class="field" for="filterType">
          <span>Type</span>
          <select id="filterType">
            <option value="all">All</option>
            <option value="ebook">eBook</option>
            <option value="audiobook">Audiobook</option>
            <option value="both">Both</option>
          </select>
        </label>

        <label class="field" for="filterAccess">
          <span>Free/Paid</span>
          <select id="filterAccess">
            <option value="all">All</option>
            <option value="free">Free</option>
            <option value="paid">Paid</option>
          </select>
        </label>

        <label class="field" for="filterSort">
          <span>Sort</span>
          <select id="filterSort">
            <option value="relevance">Relevance</option>
            <option value="popularity">Popularity</option>
            <option value="newest">Newest</option>
            <option value="title">Title</option>
          </select>
        </label>

        <label class="field" for="minPopularity">
          <span>Min Popularity</span>
          <input id="minPopularity" type="range" min="0" max="100" step="1" value="0" />
          <small id="minPopularityText">0+</small>
        </label>
      </aside>

      <div class="results-area">
        <div class="results-head">
          <p id="resultsMeta">Loading results...</p>
          <button type="button" id="openDrawerBtn" class="text-btn mobile-only">Filters</button>
        </div>

        <section class="result-group" aria-labelledby="booksHeading">
          <div class="group-head">
            <h2 id="booksHeading">Books</h2>
            <span id="booksCount">0</span>
          </div>
          <div id="booksResults" class="cards-grid"></div>
        </section>

        <section class="result-group" aria-labelledby="authorsHeading">
          <div class="group-head">
            <h2 id="authorsHeading">Authors</h2>
            <span id="authorsCount">0</span>
          </div>
          <div id="authorsResults" class="authors-grid"></div>
        </section>

        <section class="result-group" aria-labelledby="audioHeading">
          <div class="group-head">
            <h2 id="audioHeading">Audiobooks</h2>
            <span id="audioCount">0</span>
          </div>
          <div id="audioResults" class="cards-grid"></div>
        </section>
      </div>
    </section>
  </main>

  <div id="filterDrawer" class="filter-drawer" aria-hidden="true">
    <div class="drawer-card">
      <div class="filters-head">
        <h2>Advanced Filters</h2>
        <button type="button" id="closeDrawerBtn" class="text-btn">Close</button>
      </div>
      <div id="drawerFiltersMount"></div>
    </div>
  </div>

  <script src="discover.js"></script>
</body>
</html>
