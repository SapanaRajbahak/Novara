<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novara Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span>Novara</span>
    </a>
    <nav class="top-nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="profile.html">Profile</a>
      <a href="settings.html" class="active">Settings</a>
    </nav>
  </header>

  <main class="settings-page">
    <section class="hero">
      <h1>User Settings</h1>
      <p>Manage your account and personalize your reading and listening experience.</p>
      <div id="globalMessage" class="message" aria-live="polite"></div>
    </section>

    <section class="panel" aria-labelledby="accountHeading">
      <div class="panel-head">
        <h2 id="accountHeading">Account</h2>
      </div>
      <form id="accountForm" novalidate>
        <div class="fields two-col">
          <label class="field" for="displayName">
            <span>Display Name</span>
            <input id="displayName" name="displayName" type="text" maxlength="60" required />
          </label>
          <label class="field" for="email">
            <span>Email</span>
            <input id="email" name="email" type="email" required />
          </label>
        </div>
        <label class="field" for="bio">
          <span>Bio</span>
          <textarea id="bio" name="bio" rows="3" maxlength="220"></textarea>
        </label>
        <div class="actions">
          <span id="accountError" class="error" aria-live="polite"></span>
          <button type="submit" class="btn">Save Account</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="appearanceHeading">
      <div class="panel-head">
        <h2 id="appearanceHeading">Appearance</h2>
      </div>
      <form id="appearanceForm" novalidate>
        <div class="fields two-col">
          <label class="field" for="appTheme">
            <span>App Theme</span>
            <select id="appTheme" name="appTheme">
              <option value="system">System Default</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="sepia">Sepia</option>
            </select>
          </label>
          <label class="field" for="appDensity">
            <span>Layout Density</span>
            <select id="appDensity" name="appDensity">
              <option value="comfortable">Comfortable</option>
              <option value="compact">Compact</option>
            </select>
          </label>
        </div>
        <div class="actions">
          <span id="appearanceError" class="error" aria-live="polite"></span>
          <button type="submit" class="btn">Save Appearance</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="readerHeading">
      <div class="panel-head">
        <h2 id="readerHeading">Reader Preferences</h2>
      </div>
      <form id="readerForm" novalidate>
        <div class="fields three-col">
          <label class="field" for="defaultFontSize">
            <span>Default Font Size</span>
            <input id="defaultFontSize" name="defaultFontSize" type="number" min="14" max="30" required />
          </label>
          <label class="field" for="defaultReaderTheme">
            <span>Default Theme</span>
            <select id="defaultReaderTheme" name="defaultReaderTheme">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="sepia">Sepia</option>
            </select>
          </label>
          <label class="field" for="defaultReadingMode">
            <span>Reading Mode</span>
            <select id="defaultReadingMode" name="defaultReadingMode">
              <option value="scroll">Scroll</option>
              <option value="paginated">Paginated</option>
            </select>
          </label>
        </div>
        <div class="actions">
          <span id="readerError" class="error" aria-live="polite"></span>
          <button type="submit" class="btn">Save Reader Preferences</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="audioHeading">
      <div class="panel-head">
        <h2 id="audioHeading">Audio Preferences</h2>
      </div>
      <form id="audioForm" novalidate>
        <div class="fields three-col">
          <label class="field" for="defaultAudioSpeed">
            <span>Default Speed</span>
            <select id="defaultAudioSpeed" name="defaultAudioSpeed">
              <option value="0.75">0.75x</option>
              <option value="1">1x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="1.75">1.75x</option>
              <option value="2">2x</option>
            </select>
          </label>
          <label class="field" for="voiceProfile">
            <span>Voice (Placeholder)</span>
            <select id="voiceProfile" name="voiceProfile">
              <option value="default">Default Narrator</option>
              <option value="warm">Warm Voice</option>
              <option value="clear">Clear Voice</option>
              <option value="expressive">Expressive Voice</option>
            </select>
          </label>
          <label class="field checkbox-row" for="autoPlayNext">
            <span>Auto-play Next Chapter</span>
            <input id="autoPlayNext" name="autoPlayNext" type="checkbox" />
          </label>
        </div>
        <div class="actions">
          <span id="audioError" class="error" aria-live="polite"></span>
          <button type="submit" class="btn">Save Audio Preferences</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="notificationsHeading">
      <div class="panel-head">
        <h2 id="notificationsHeading">Notifications</h2>
      </div>
      <form id="notificationsForm" novalidate>
        <div class="fields two-col">
          <label class="field checkbox-row" for="notifyRecommendations">
            <span>Personalized recommendations</span>
            <input id="notifyRecommendations" name="notifyRecommendations" type="checkbox" />
          </label>
          <label class="field checkbox-row" for="notifyReleases">
            <span>New release alerts</span>
            <input id="notifyReleases" name="notifyReleases" type="checkbox" />
          </label>
          <label class="field checkbox-row" for="notifyStreaks">
            <span>Reading streak reminders</span>
            <input id="notifyStreaks" name="notifyStreaks" type="checkbox" />
          </label>
          <label class="field checkbox-row" for="notifyPromotions">
            <span>Promotions and offers</span>
            <input id="notifyPromotions" name="notifyPromotions" type="checkbox" />
          </label>
        </div>
        <div class="actions">
          <span id="notificationsError" class="error" aria-live="polite"></span>
          <button type="submit" class="btn">Save Notifications</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="privacyHeading">
      <div class="panel-head">
        <h2 id="privacyHeading">Privacy</h2>
      </div>
      <form id="privacyForm" novalidate>
        <div class="fields two-col">
          <label class="field" for="profileVisibility">
            <span>Profile Visibility</span>
            <select id="profileVisibility" name="profileVisibility">
              <option value="private">Private</option>
              <option value="friends">Friends Only</option>
              <option value="public">Public</option>
            </select>
          </label>
          <label class="field" for="dataSharing">
            <span>Data Sharing</span>
            <select id="dataSharing" name="dataSharing">
              <option value="essential">Essential Only</option>
              <option value="limited">Limited Analytics</option>
              <option value="full">Full Personalization</option>
            </select>
          </label>
        </div>
        <div class="actions">
          <span id="privacyError" class="error" aria-live="polite"></span>
          <button type="submit" class="btn">Save Privacy Settings</button>
        </div>
      </form>
    </section>
  </main>

  <script src="settings.js"></script>
</body>
</html>
